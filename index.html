<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>

    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #d7e1ec, #f7f9fc);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            max-width: 400px;
            width: 100%;
            border-radius: 18px;
            padding: 25px 20px 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
            color: #222;
        }

        p {
            font-size: 13px;
            color: #555;
            margin-bottom: 18px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        input[type="text"]:focus {
            border-color: #4c4c4c;
            box-shadow: 0 0 0 2px rgba(76, 76, 76, 0.15);
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: #333;
            color: white;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.25s;
        }

        button:hover {
            background: #555;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }

        #qrcode {
            margin-top: 20px;
            padding: 15px;
            border-radius: 15px;
            background: #fff;
            display: inline-block;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        .note {
            font-size: 11px;
            color: #777;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>QR Code Generator</h1>
    <p>Type any text, URL, or message below and generate a QR code instantly.</p>

    <div class="input-group">
        <label for="text">Enter text / URL</label>
        <input type="text" id="text" placeholder="e.g. https://linkedin.com/in/yourname">
    </div>

    <button onclick="generateQR()">Generate QR Code</button>

    <div id="qrcode"></div>

    <p class="note">Tip: Try your portfolio link, LinkedIn, or any message.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
    let qr; 

    function generateQR() {
        const text = document.getElementById("text").value.trim();

        if (text === "") {
            alert("Please enter some text or URL!");
            return;
        }
        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = "";

        qr = new QRCode(qrContainer, {
            text: text,
            width: 180,
            height: 180,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    }
</script>

</body>
</html>
